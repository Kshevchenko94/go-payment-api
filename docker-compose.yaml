version: '3.8'

services:
  # 1. СУБД PostgreSQL — для транзакций, кошельков и outbox_events
  postgres:
    image: postgres:16-alpine
    container_name: fintech_postgres
    restart: always
    environment:
      POSTGRES_USER: fintech_user
      POSTGRES_PASSWORD: fintech_password
      POSTGRES_DB: fintech_limits
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Redis — для кэширования сессий, блеклиста JWT и идемпотентности (SETNX)
  redis:
    image: redis:7-alpine
    container_name: fintech_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 3. RabbitMQ — брокер сообщений для асинхронного Transactional Outbox
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fintech_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # Порт для отправки сообщений из Go приложений
      - "15672:15672" # Порт для веб-панели управления (логин/пароль: guest/guest)
    volumes:
      - rmqdata:/var/lib/rabbitmq

volumes:
  pgdata:
  redisdata:
  rmqdata:
